<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KWS Bot – Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { color: #2a7d3f; margin-bottom: 8px; }
    p { color: #666; line-height: 1.6; margin-bottom: 16px; }
    .badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2a7d3f;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .hint {
      font-size: 13px;
      color: #999;
      background: #f9f9f9;
      border-radius: 10px;
      padding: 12px 16px;
      text-align: left;
    }
    .hint strong { color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⛰️ KWS Bot</h1>
    <div class="badge">Demo-Seite</div>
    <p>
      Der Chat-Assistent der Kletterwelt Sauerland ist bereit.<br>
      Klicke auf den grünen Button unten rechts!
    </p>
    <div class="hint">
      <strong>Testfragen:</strong><br>
      „Wann habt ihr geöffnet?"<br>
      „Was kostet der Eintritt?"<br>
      „Gibt es Kurse für Kinder?"<br>
      „Kann ich euch anrufen?"
    </div>
  </div>

  <!-- Chat-Widget einbinden – so kommt es später auf die KWS-Website -->
  <script
    src="/widget.js"
    data-api-url="/api/chat"
    data-theme-color="#2a7d3f"
    data-title="KWS Assistent"
    data-subtitle="Wie kann ich helfen?"
    data-welcome="Hallo! Ich bin der Assistent der Kletterwelt Sauerland. Wie kann ich dir helfen?"
  ></script>
</body>
</html>
